name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "vod-web API base (http/https, no path or credentials)"
        required: true
        default: "http://172.16.3.70:8790"
        type: string

permissions:
  contents: read

jobs:
  ios:
    name: Analyze, test and build iOS
    runs-on: macos-15
    timeout-minutes: 45
    env:
      VOD_API_BASE: ${{ inputs.api_base }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build evidence
        run: mkdir -p build/evidence

      - name: Set up Flutter 3.47.8
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Record toolchain
        run: |
          flutter --version | tee toolchain.txt
          xcodebuild -version | tee -a toolchain.txt
          pod --version | tee -a toolchain.txt
          flutter doctor -v | tee -a toolchain.txt

      - name: Use CocoaPods for plugins without Swift Package support
        run: flutter config --no-enable-swift-package-manager

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Static analysis
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee build/evidence/analyze.log

      - name: Unit and widget tests
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee build/evidence/tests.log

      - name: Test native iOS HttpOnly cookie bridge
        # Exercise the real iOS cookie plugin before producing the release IPA.
        # The fixture uses no real account and is deleted after the test.
        run: |
          set -euo pipefail
          flutter precache --ios
          (cd ios && pod install)
          xcrun simctl list devices available -j > build/evidence/simulators.json
          SIMULATOR_ID=$(python3 -c 'import json; d=json.load(open("build/evidence/simulators.json")); print(next(x["udid"] for group in d["devices"].values() for x in group if x.get("isAvailable") and x["name"].startswith("iPhone")))')
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          NATIVE_TEST_DEFINES=$(printf '%s' 'VOD_API_BASE=http://127.0.0.1:9' | base64)
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$PWD/build/evidence/ios-cookie-tests.xcresult" \
            -only-testing:RunnerTests/RunnerTests/testHttpOnlyCookieBridgeAcrossQuarkHosts \
            TEST_HOST= BUNDLE_LOADER= \
            'LD_RUNPATH_SEARCH_PATHS=$(inherited) $(BUILT_PRODUCTS_DIR)/Runner.app/Frameworks $(PLATFORM_DIR)/Developer/Library/Frameworks' \
            CODE_SIGNING_ALLOWED=NO FLUTTER_BUILD_MODE=debug "DART_DEFINES=$NATIVE_TEST_DEFINES" \
            2>&1 | tee build/evidence/ios-cookie-test.log

      - name: Record native cookie test result
        if: always()
        run: |
          RESULT="$PWD/build/evidence/ios-cookie-tests.xcresult"
          if test -d "$RESULT"; then
            xcrun xcresulttool get test-results summary --path "$RESULT" > build/evidence/ios-cookie-test-summary.json || true
            xcrun xcresulttool export diagnostics --path "$RESULT" --output-path build/evidence/ios-cookie-diagnostics || true
          fi

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          flutter build ios \
            --release \
            --no-codesign \
            --dart-define=VOD_API_BASE="$VOD_API_BASE" 2>&1 | tee build/evidence/ios-build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          test -d "$APP_PATH"
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          cp -R "$APP_PATH" build/ios/ipa/Payload/Runner.app
          (
            cd build/ios/ipa
            zip -qry CinemaClient-unsigned.ipa Payload
            shasum -a 256 CinemaClient-unsigned.ipa > CinemaClient-unsigned.ipa.sha256
            du -h CinemaClient-unsigned.ipa
          )

      - name: Upload unsigned IPA and evidence
        uses: actions/upload-artifact@v4
        with:
          name: cinema-client-ios-unsigned
          if-no-files-found: error
          path: |
            build/ios/ipa/CinemaClient-unsigned.ipa
            build/ios/ipa/CinemaClient-unsigned.ipa.sha256
            ios/Podfile.lock
            toolchain.txt
            pubspec.lock
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinema-client-ios-diagnostics
          if-no-files-found: warn
          path: |
            build/evidence/
            toolchain.txt
          retention-days: 14
